<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The item graph · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · attention-firewall</p>
    <h1>The item graph</h1>

    <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="item-graph-title item-graph-desc">
      <title id="item-graph-title">The item graph</title>
      <desc id="item-graph-desc">State machine showing an fw item entering holding, being pulled or overridden into an active slot, stalling by timestamp, parking as waiting or delegated, and ending as done or dropped.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Transitions (drawn first) ===== -->
      <!-- add: start -> holding -->
      <line x1="32" y1="240" x2="80" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- pull: holding -> active (focal, human decision) -->
      <line x1="240" y1="224" x2="400" y2="224" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- override: holding -> active -->
      <line x1="240" y1="256" x2="400" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- wait: active -> waiting -->
      <line x1="452" y1="200" x2="452" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- resume: waiting -> active -->
      <line x1="508" y1="120" x2="508" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- stall: active -> stalled (system, by timestamp) -->
      <line x1="480" y1="280" x2="480" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- resume: stalled -> active -->
      <line x1="520" y1="360" x2="520" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- delegate: active -> delegated -->
      <line x1="560" y1="224" x2="720" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- done: active -> done (right, down, right) -->
      <path d="M 560 256 H 632 A 8 8 0 0 1 640 264 V 392 A 8 8 0 0 0 648 400 H 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- done: delegated -> done -->
      <line x1="800" y1="280" x2="800" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- drop: active -> dropped (down, left, down) -->
      <path d="M 440 280 V 304 A 8 8 0 0 1 432 312 H 168 A 8 8 0 0 0 160 320 V 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Transition labels (masked, 8px off the stroke) ===== -->
      <rect x="44" y="220" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="58" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADD</text>

      <rect x="302" y="204" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="213" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PULL</text>

      <rect x="290" y="264" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="273" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OVERRIDE</text>

      <rect x="408" y="154" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="163" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAIT</text>

      <rect x="516" y="154" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="542" y="163" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESUME</text>

      <rect x="432" y="330" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="452" y="339" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STALL</text>

      <rect x="528" y="330" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="554" y="339" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESUME</text>

      <rect x="610" y="204" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DELEGATE</text>

      <rect x="592" y="314" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="610" y="323" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>

      <rect x="808" y="314" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="826" y="323" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>

      <rect x="282" y="292" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DROP</text>

      <!-- ===== Start dot ===== -->
      <circle cx="24" cy="240" r="6" fill="#2d3142"/>

      <!-- ===== States ===== -->
      <!-- holding (input) -->
      <rect x="80" y="200" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="80" y="200" width="160" height="80" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="108" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="160" y="248" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">holding</text>
      <text x="160" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no slot · needs a mission</text>

      <!-- active (focal) -->
      <rect x="400" y="200" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="400" y="200" width="160" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="408" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="428" y="217" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="480" y="248" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">active</text>
      <text x="480" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one slot · until DATE</text>

      <!-- waiting (parked) -->
      <rect x="400" y="40" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="400" y="40" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="408" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="428" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="480" y="88" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">waiting</text>
      <text x="480" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frees its slot</text>

      <!-- stalled (still holds a slot) -->
      <rect x="400" y="360" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="400" y="360" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="408" y="368" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="428" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="480" y="404" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stalled</text>
      <text x="480" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">idle > stall-days</text>
      <text x="480" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keeps its slot</text>

      <!-- delegated (parked) -->
      <rect x="720" y="200" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="720" y="200" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="728" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="748" y="217" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="800" y="248" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">delegated</text>
      <text x="800" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frees its slot</text>

      <!-- done (terminal) -->
      <rect x="720" y="360" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="720" y="360" width="160" height="80" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="728" y="368" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="756" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
      <text x="800" y="408" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">done</text>

      <!-- dropped (terminal) -->
      <rect x="80" y="360" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="80" y="360" width="160" height="80" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="88" y="368" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="116" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
      <text x="160" y="408" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dropped</text>

      <!-- ===== Callouts (margins only) ===== -->
      <!-- 1. pull guard, top-left margin, lands on the pull arrow -->
      <text x="80" y="48" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">pull needs a free slot, a mission,</text>
      <text x="80" y="68" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">and a human. override skips the cap;</text>
      <text x="80" y="88" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">after two, only delegate or drop remain.</text>
      <path d="M 240 100 Q 260 164 280 220" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="280" cy="222" r="2" fill="#eb6c36"/>

      <!-- 2. drop from anywhere, bottom-left margin, lands on the drop arrow -->
      <text x="80" y="500" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">drop is allowed from every non-terminal state.</text>
      <path d="M 72 484 Q 32 312 152 344" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="156" cy="344" r="2" fill="#2d3142"/>

      <!-- ===== Legend strip ===== -->
      <line x1="30" y1="612" x2="930" y2="612" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="620" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="132" y="629" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">OCCUPIES A SLOT · HUMAN PULL</text>

      <rect x="336" y="620" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="356" y="629" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PARKED · NO SLOT</text>

      <line x1="496" y1="626" x2="528" y2="626" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="536" y="629" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">COMMAND · HUMAN OR AGENT</text>

      <line x1="720" y1="626" x2="752" y2="626" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="760" y="629" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SYSTEM · TIMESTAMP ARITHMETIC</text>
    </svg>
  </div>
</body>
</html>
