[project]
name = "attention-firewall"
version = "0.1.0"
description = "Measure and protect one knowledge worker's bandwidth with a pull-based, two-column model."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Justin Largo", email = "justinlargo7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fw = "attention_firewall.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--cov=attention_firewall --cov-fail-under=70"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
